[project]
name = "pathora-ai"
version = "0.1.0"
description = "Explainable multi-agent STEM college decision platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
# Everything below is optional so the core workflow runs with zero external
# infrastructure (see README "Degraded mode").
infra = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pinecone-client>=5.0",
    "langgraph-checkpoint-postgres>=2.0",
]
llm = [
    "anthropic>=0.34",
    "openai>=1.40",
    "langsmith>=0.1",
]
ui = ["streamlit>=1.37"]
mcp = ["mcp>=1.0"]
dev = [
    "streamlit>=1.37",
    "pyyaml>=6.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The seed corpus is prose-heavy synthetic demo data; long strings are clearer
# left intact than wrapped.
"scripts/build_seed_corpus.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["pathora"]
mypy_path = "src"
ignore_missing_imports = true
plugins = []
