# Development overrides, applied automatically by `docker compose up`.
#
# Without this, `src` is baked into the image at build time and `docker compose
# up` (no --build) keeps serving the code from the last build — the usual cause
# of "localhost:8501 is showing the old application". These bind mounts make the
# running container read your working tree instead.
#
# Delete this file, or run `docker compose -f docker-compose.yml up`, to test
# the immutable image the way it deploys.
services:
  api:
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    command: uvicorn pathora.api.main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    environment:
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: poll
