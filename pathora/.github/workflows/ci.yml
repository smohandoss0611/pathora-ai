name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/pathora
      - name: Evals (offline, deterministic provider)
        env:
          LLM_PROVIDER: fake
        run: |
          pip install pyyaml
          python evals/run.py --provider fake --json eval-report.json
      - name: Tests
        env:
          LLM_PROVIDER: fake
          VECTOR_BACKEND: memory
        run: pytest -q --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            report.xml
            eval-report.json

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pathora-ai:${{ github.sha }} .
