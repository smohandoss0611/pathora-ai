# Eval cases for Pathora AI.
#
# These are NOT unit tests. Unit tests assert deterministic behaviour on fixed
# inputs. These measure whether the system produces defensible OUTCOMES on cases
# where the answer is a judgment — and they run against whatever provider is
# configured, so they cost money and take minutes.
#
# Each case states PROPERTIES the output must satisfy, never exact strings. An
# eval that pins prose breaks on every prompt change and measures nothing.

cases:
  - id: strong_stem_texas
    description: >
      Strong IB/AP record, above-median test score, Texas preference. The
      baseline happy path: should classify most colleges and produce a spread
      of selectivity rather than everything in one bucket.
    transcript: real_tabular_transcript.pdf
    student_input:
      testing: {sat_total: 1450}
      stem_interests: [Computer Science, Data Science]
      activities:
        - {name: Eagle Scout, role: Eagle Scout, years: ["2023-2024", "2024-2025"]}
      projects:
        - {name: Trade Analyser, technologies: [Python]}
      preferences: {locations: [TX], school_size: Large}
    expect:
      min_colleges: 3
      max_abstention_rate: 0.5
      selectivity_spread: true
      grounded_evidence: true
      no_fabricated_probability: true
      college_specific_reasoning: true

  - id: no_test_score
    description: >
      Same record, no SAT or ACT. Must not silently treat a missing score as a
      good one; the gap should be named as missing information.
    transcript: real_tabular_transcript.pdf
    student_input:
      stem_interests: [Computer Science]
      preferences: {locations: [TX]}
    expect:
      min_colleges: 3
      grounded_evidence: true
      names_missing_test_score: true
      no_fabricated_probability: true

  - id: weaker_record
    description: >
      No AP, no calculus, GPA around 3.0. Should classify meaningfully more
      conservatively than the strong record on the same colleges.
    transcript: sample_transcript_weaker.txt
    student_input:
      testing: {sat_total: 1080}
      stem_interests: [Information Science]
      preferences: {locations: [TX]}
    expect:
      min_colleges: 2
      grounded_evidence: true
      no_fabricated_probability: true
      more_conservative_than: strong_stem_texas

  - id: uncorroborated_college
    description: >
      A college with nothing in the corpus and no federal record. The system
      must abstain rather than classify from model memory. This is the case
      that separates a grounded system from a plausible-sounding one.
    transcript: sample_transcript.txt
    student_input:
      testing: {sat_total: 1400}
      stem_interests: [Computer Science]
    force_colleges: ["Nonexistent Institute of Technology"]
    disable_live_lookup: true
    expect:
      all_abstain: true
      abstention_gives_reasons: true

  - id: unpublished_major_rate
    description: >
      Colleges publishing only a university-wide admit rate. Safety must not be
      claimed for the major, and the gap must be stated rather than glossed.
    transcript: sample_transcript.txt
    student_input:
      testing: {sat_total: 1500}
      stem_interests: [Computer Science]
      preferences: {locations: [TX]}
    expect:
      min_colleges: 2
      grounded_evidence: true
      names_major_rate_gap: true
      no_unjustified_safety: true
