services:
  - type: web
    name: pathora-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: fake
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase: {name: pathora-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: redis, name: pathora-redis, property: connectionString}

  - type: web
    name: pathora-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run src/pathora/ui/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: LLM_PROVIDER
        value: fake

  - type: redis
    name: pathora-redis
    ipAllowList: []
    plan: free

databases:
  - name: pathora-db
    plan: free
