services:
  api:
    build: .
    command: uvicorn pathora.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pathora:pathora@postgres:5432/pathora
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  ui:
    build: .
    command: streamlit run src/pathora/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    env_file:
      - path: .env
        required: false
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathora
      POSTGRES_PASSWORD: pathora
      POSTGRES_DB: pathora
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathora"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
